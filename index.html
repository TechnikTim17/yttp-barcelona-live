<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YTTP AI Workshop Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --offwhite:#F3F2EE; --hellgrau:#DBDBDB; --taupe:#827B6D;
    --anthrazit:#1C1C1C; --sage:#9CA095; --orange:#D7662F;
    --font:"Inter",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--font); background:var(--offwhite); color:var(--anthrazit);
    -webkit-font-smoothing:antialiased; line-height:1.45;
    padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  }
  .wrap{max-width:640px; margin:0 auto; padding:20px 18px 60px}
  .eyebrow{font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--taupe); font-weight:600}
  h1{font-size:26px; font-weight:700; margin:.2em 0 .1em; letter-spacing:-.01em}
  h2{font-size:21px; font-weight:700; margin:.1em 0 .5em; letter-spacing:-.01em; text-wrap:balance}
  p.lead{font-size:16px; color:var(--anthrazit)}
  .muted{color:var(--taupe)}
  .accent{width:26px;height:8px;background:var(--orange);border-radius:1px;margin-bottom:14px}
  .card{background:var(--hellgrau); border-radius:2px; padding:16px 16px}
  .stack>*+*{margin-top:12px}
  button.opt{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    width:100%; text-align:left; font-family:var(--font); font-size:16px; font-weight:500;
    background:#fff; color:var(--anthrazit); border:1px solid var(--hellgrau);
    border-radius:2px; padding:15px 16px; cursor:pointer; transition:border-color .12s, background .12s;
  }
  button.opt:hover{border-color:var(--taupe)}
  button.opt.sel{border-color:var(--anthrazit); background:#fff; box-shadow:inset 0 0 0 1px var(--anthrazit)}
  button.opt .pct{font-variant-numeric:tabular-nums; color:var(--taupe); font-weight:700; font-size:14px}
  .bar{position:relative; overflow:hidden}
  .bar .fill{position:absolute; inset:0 auto 0 0; background:var(--sage); opacity:.35; width:0; transition:width .5s ease}
  .bar .lab{position:relative; z-index:1; display:flex; justify-content:space-between; width:100%}
  .btn{
    font-family:var(--font); font-weight:700; font-size:16px; border:none; border-radius:2px;
    padding:15px 18px; cursor:pointer; background:var(--anthrazit); color:var(--offwhite); width:100%;
  }
  .btn.ghost{background:transparent; color:var(--anthrazit); border:1px solid var(--anthrazit)}
  .btn:disabled{opacity:.4; cursor:default}
  input[type=text]{
    width:100%; font-family:var(--font); font-size:16px; padding:15px 16px;
    border:1px solid var(--hellgrau); border-radius:2px; background:#fff; color:var(--anthrazit);
  }
  input[type=text]:focus{outline:none; border-color:var(--anthrazit)}
  .ideas{display:flex; flex-wrap:wrap; gap:10px}
  .idea{background:#fff; border:1px solid var(--hellgrau); border-radius:2px; padding:10px 13px; font-size:15px; max-width:100%}
  .words{display:flex; flex-wrap:wrap; gap:10px; align-items:baseline}
  .words.cloud{justify-content:center; align-items:center; text-align:center; gap:6px 20px; padding:14px 8px; min-height:120px}
  .words.cloud.big{gap:10px 30px; min-height:220px}
  .word{color:var(--anthrazit); font-weight:700; line-height:1.05; letter-spacing:-.01em}
  .word.c0{color:var(--orange)}
  .word.c1{color:var(--anthrazit)}
  .word.c2{color:var(--taupe)}
  .word .mult{color:var(--taupe); font-weight:500; font-size:.55em; letter-spacing:0}
  .net{position:relative; width:100%; height:62vh; min-height:340px; background:var(--anthrazit); border-radius:3px; overflow:hidden; margin-top:6px}
  .netcv{position:absolute; inset:0; display:block}
  .count{font-size:13px; color:var(--taupe); margin-top:6px}
  .leader{font-size:24px; font-weight:700; letter-spacing:-.01em; margin:2px 0 8px; text-wrap:balance}
  .big-bar{padding:20px 16px; font-size:19px}
  .big-bar .pct{font-size:16px}
  .opt.lead{border-color:var(--orange); box-shadow:inset 0 0 0 2px var(--orange)}
  .fill.leadfill{background:var(--orange); opacity:.20}
  .voters{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 4px}
  .voter{font-size:13px; color:var(--anthrazit); background:#fff; border:1px solid var(--hellgrau); border-radius:2px; padding:4px 8px}
  .center{text-align:center}
  .big{font-size:40px; font-weight:700; letter-spacing:-.02em; margin:.1em 0}
  .qr{background:#fff; padding:14px; border-radius:2px; display:inline-block; margin-top:8px}
  .qr img,.qr canvas{display:block}
  /* Moderator */
  .modbar{position:sticky; top:env(safe-area-inset-top,0); z-index:20; background:var(--anthrazit); color:var(--offwhite); border-radius:2px; padding:12px; margin-bottom:16px}
  .modbar .row{display:flex; flex-wrap:wrap; gap:8px}
  .modbar button{font-family:var(--font); font-size:13px; font-weight:600; border:1px solid #555; background:#2a2a2a; color:var(--offwhite); border-radius:2px; padding:9px 11px; cursor:pointer}
  .modbar button.on{background:var(--orange); border-color:var(--orange); color:#fff}
  .modbar .lbl{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#9a948a; width:100%; margin:6px 0 2px}
  .tag{display:inline-block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--taupe); border:1px solid var(--hellgrau); border-radius:2px; padding:3px 8px}
  .modbar .modflow{font-size:11px; color:#9a948a; margin-top:10px; line-height:1.6}
  .modbar .modflow b{color:var(--offwhite); font-weight:600}
  .hidden{display:none!important}
  footer{margin-top:34px; text-align:center; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--taupe)}
</style>
</head>
<body>
<div class="wrap">
  <div id="modbar" class="modbar hidden"></div>
  <div id="app" class="stack"></div>
  <footer>YTTP · AI Workshop Barcelona</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const SUPABASE_URL="%%SUPABASE_URL%%";
const SUPABASE_KEY="%%SUPABASE_KEY%%";
const MOD_SECRET="%%MOD_SECRET%%";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime:{ params:{ eventsPerSecond:5 } } });

// ---- client identity (anonym) ----
function cid(){
  try{ let c=localStorage.getItem("bcn_cid"); if(!c){ c=Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem("bcn_cid",c);} return c; }
  catch(e){ return "anon"+Math.random().toString(36).slice(2); }
}
const CID = cid();
function getName(){ try{ return localStorage.getItem("bcn_name")||""; }catch(e){ return VNAME; } }
function setName(n){ VNAME=n; try{ localStorage.setItem("bcn_name",n); }catch(e){} }
let VNAME=""; let VOTING=false;
function showNames(){ try{ return localStorage.getItem("bcn_shownames")!=="0"; }catch(e){ return true; } }
const params = new URLSearchParams(location.search);
const isMod = params.get("mod")===MOD_SECRET && MOD_SECRET!=="";

// ---- content ----
const POLLS=[
  {q:"Wie fühlst du dich gerade?", type:"word"},
  {q:"Dein Barcelona 2026 in einem Wort?", type:"word"},
  {q:"Wäre dein Trainingsstil ein Tier, welches?", type:"word"},
  {q:"Was macht YTTP für dich besonders?", type:"word"},
  {q:"Dein Verhältnis zu KI in einem Wort?", type:"word"}
];
const GROUPS=["Studio Experience","Kurskonzept & Auslastung","Finance & Buchhaltung","Marketing & Brand","HR & Weiterbildung"];
const QUIZ=[
  {q:"Wofür steht das GPT in ChatGPT?", opts:["General Purpose Technology","Generative Pretrained Transformer","Great Personal Trainer"], a:1},
  {q:"Was kann KI heute NICHT zuverlässig?", opts:["Bilder erzeugen","Die nächsten Lottozahlen vorhersagen","Texte übersetzen"], a:1},
  {q:"Was ist ein Prompt?", opts:["Die Anweisung an die KI","Ein Fehler im Modell","Eine YTTP Kursart"], a:0},
  {q:"Was solltest du NIE in eine öffentliche KI eingeben?", opts:["Eine Frage","Passwörter und Kundendaten","Eine wilde Idee"], a:1},
  {q:"Was von diesen dreien gibt es bei YTTP wirklich?", opts:["Reformer","Barre","Beides"], a:2}
];

let STATE={stage:"welcome",poll_index:0,wall_open:false,quiz_index:-1,quiz_reveal:false};
let mine={polls:{},vote:null,quiz:{}};

async function loadMine(){
  try{
    const {data:pr}=await sb.from("bcn_poll_responses").select("question,value").eq("client_id",CID);
    (pr||[]).forEach(r=>mine.polls[r.question]=r.value);
    const {data:vt}=await sb.from("bcn_votes").select("choice").eq("client_id",CID).maybeSingle();
    if(vt) mine.vote=vt.choice;
    const {data:qz}=await sb.from("bcn_quiz_answers").select("q_index,choice").eq("client_id",CID);
    (qz||[]).forEach(r=>mine.quiz[r.q_index]=r.choice);
  }catch(e){}
}

// ---- data helpers ----
async function pollCounts(qtext){
  const {data}=await sb.from("bcn_poll_responses").select("value").eq("question",qtext);
  return data||[];
}
async function ideaList(){
  const {data}=await sb.from("bcn_ideas").select("text,created_at").order("created_at",{ascending:false}).limit(60);
  return data||[];
}
async function voteCounts(){
  const {data}=await sb.from("bcn_votes").select("client_id,choice,voter_name").order("created_at",{ascending:true});
  return data||[];
}
async function quizCounts(qi){
  const {data}=await sb.from("bcn_quiz_answers").select("choice,is_correct").eq("q_index",qi);
  return data||[];
}

// ---- rendering ----
const app=document.getElementById("app");
function el(html){const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild;}
function head(eyebrow,title){return `<div class="head"><div class="accent"></div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2></div>`;}

async function render(){
  const s=STATE;
  // Moderator-Umfrage hat eine eigene, animierte Ansicht, die sich nicht bei jedem
  // Render neu aufbaut. Ausserhalb davon das Netz abbauen.
  if(!(isMod && s.stage==="poll")) teardownNet();
  if(isMod && s.stage==="poll") return renderModPoll();
  if(s.stage==="welcome") return renderWelcome();
  if(s.stage==="poll") return renderPoll();
  if(s.stage==="wall") return renderWall();
  if(s.stage==="vote") return renderVote();
  if(s.stage==="quiz") return renderQuiz();
  if(s.stage==="thanks") return renderThanks();
  app.innerHTML="";
}

function renderWelcome(){
  app.innerHTML="";
  app.appendChild(el(`<div class="center">
    <div class="eyebrow">YTTP Barcelona 2026</div>
    <div class="big">AI Workshop</div>
    <p class="lead muted">Gleich geht es los. Lass dein Handy griffbereit.</p>
  </div>`));
  if(isMod){
    const box=el(`<div class="center"><p class="muted">Teilnehmer scannen diesen Code:</p><div class="qr" id="qr"></div></div>`);
    app.appendChild(box);
    const url=location.origin+location.pathname;
    new QRCode(box.querySelector("#qr"),{text:url,width:190,height:190,colorDark:"#1C1C1C",colorLight:"#ffffff"});
    app.appendChild(el(`<p class="center muted" style="font-size:13px">${url}</p>`));
  }
}

async function renderPoll(){
  const p=POLLS[STATE.poll_index]; if(!p){app.innerHTML="";return;}
  app.innerHTML="";
  app.appendChild(el(head(`Live · Opener · Frage ${STATE.poll_index+1} von ${POLLS.length}`, p.q)));
  const answered = mine.polls[p.q]!==undefined;

  if(p.type==="choice"){
    if(!answered && !isMod){
      const box=el(`<div class="stack"></div>`);
      p.opts.forEach(o=>{
        const b=el(`<button class="opt"><span>${o}</span></button>`);
        b.onclick=async()=>{ await submitPoll(p.q,o); };
        box.appendChild(b);
      });
      app.appendChild(box);
    }else{
      const rows=await pollCounts(p.q);
      const total=rows.length||1;
      const counts={}; p.opts.forEach(o=>counts[o]=0);
      rows.forEach(r=>{ if(counts[r.value]!==undefined) counts[r.value]++; });
      const box=el(`<div class="stack"></div>`);
      p.opts.forEach(o=>{
        const pct=Math.round((counts[o]/total)*100);
        const sel = mine.polls[p.q]===o ? " sel":"";
        box.appendChild(el(`<div class="opt bar${sel}"><span class="fill" style="width:${pct}%"></span><span class="lab"><span>${o}</span><span class="pct">${pct}%</span></span></div>`));
      });
      app.appendChild(box);
      app.appendChild(el(`<div class="count">${rows.length} Antworten</div>`));
    }
  }else{ // word (nur Teilnehmer; Moderator laeuft ueber renderModPoll)
    if(mine.polls[p.q]===undefined){
      const box=el(`<div class="stack"><input type="text" id="w" maxlength="28" placeholder="Ein Wort ..."><button class="btn" id="ws">Absenden</button></div>`);
      app.appendChild(box);
      box.querySelector("#ws").onclick=async()=>{
        const v=box.querySelector("#w").value.trim(); if(!v) return;
        await submitPoll(p.q,v);
      };
    }else{
      app.appendChild(el(`<div class="card center" style="padding:34px 18px"><div class="big" style="font-size:34px">Danke</div><p class="lead muted" style="margin:.4em 0 0">Deine Antwort ist da. Schau nach vorne auf die Leinwand.</p></div>`));
    }
  }
}

async function submitPoll(q,v){
  mine.polls[q]=v;
  try{ await sb.from("bcn_poll_responses").upsert({client_id:CID,question:q,value:v},{onConflict:"client_id,question"}); }catch(e){}
  refresh(true);
}

// ---- Moderator Umfrage: schwebendes Wortnetz (Obsidian-Stil), nur Kommandozentrale ----
let NET=null;
const NET_COLORS=["#F3F2EE","#9CA095","#D7662F","#DBDBDB","#C7BEA9","#AEB7C2"];
function teardownNet(){
  if(!NET) return;
  cancelAnimationFrame(NET.raf); clearInterval(NET.timer); NET=null;
}
async function renderModPoll(){
  const p=POLLS[STATE.poll_index];
  if(NET && (!p || NET.q!==p.q)) teardownNet();
  if(!p){ app.innerHTML=""; return; }
  if(NET && NET.q===p.q) return; // laeuft schon, nicht neu aufbauen (kein Flackern)
  app.innerHTML="";
  app.appendChild(el(head(`Live · Opener · Frage ${STATE.poll_index+1} von ${POLLS.length}`, p.q)));
  const root=el(`<div class="net"></div>`);
  const canvas=document.createElement("canvas"); canvas.className="netcv"; root.appendChild(canvas);
  app.appendChild(root);
  const countEl=el(`<div class="count">0 Antworten</div>`); app.appendChild(countEl);
  NET={q:p.q, root, canvas, ctx:canvas.getContext("2d"), countEl, nodes:[], raf:0, timer:0, w:0, h:0};
  sizeNet();
  await netFetch();
  NET.timer=setInterval(()=>{ if(NET) netFetch(); }, 2500);
  loopNet();
}
function sizeNet(){
  if(!NET) return;
  const r=NET.root.getBoundingClientRect();
  NET.w=Math.max(320,r.width); NET.h=Math.max(240,r.height);
  const dpr=window.devicePixelRatio||1;
  NET.canvas.width=NET.w*dpr; NET.canvas.height=NET.h*dpr;
  NET.canvas.style.width=NET.w+"px"; NET.canvas.style.height=NET.h+"px";
  NET.ctx.setTransform(dpr,0,0,dpr,0,0);
}
async function netFetch(){
  if(!NET) return;
  let rows=[]; try{ const {data}=await sb.from("bcn_poll_responses").select("value").eq("question",NET.q); rows=data||[]; }catch(e){}
  const freq={}, disp={};
  rows.forEach(r=>{ const v=(r.value||"").trim(); const k=v.toLowerCase(); if(!k) return; freq[k]=(freq[k]||0)+1; if(!disp[k]) disp[k]=v; });
  Object.keys(freq).forEach(k=>{
    const size=26+Math.min(freq[k]-1,7)*10;
    let n=NET.nodes.find(x=>x.key===k);
    if(!n){
      n={key:k,label:disp[k],freq:freq[k],size,
         x:NET.w*(0.18+0.64*Math.random()), y:NET.h*(0.18+0.64*Math.random()),
         vx:(Math.random()-0.5)*0.3, vy:(Math.random()-0.5)*0.3,
         color:NET_COLORS[NET.nodes.length%NET_COLORS.length], born:performance.now(), scale:0};
      NET.nodes.push(n);
    } else { n.freq=freq[k]; n.size=size; n.label=disp[k]; }
  });
  if(NET.countEl) NET.countEl.textContent=rows.length+" Antworten";
}
function loopNet(){
  if(!NET) return;
  const {ctx,w,h,nodes}=NET;
  ctx.clearRect(0,0,w,h);
  // sanfte Abstossung, damit Woerter nicht uebereinander liegen (keine Verbindungslinien)
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
    const a=nodes[i],b=nodes[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||1;
    const minx=(a.hw||a.size)+(b.hw||b.size)+10, miny=(a.hh||a.size*0.6)+(b.hh||b.size*0.6)+8;
    if(Math.abs(dx)<minx && Math.abs(dy)<miny){ const p=0.05, ux=dx/d, uy=dy/d; a.vx+=ux*p; a.vy+=uy*p; b.vx-=ux*p; b.vy-=uy*p; }
  }
  const now=performance.now();
  nodes.forEach(n=>{
    n.scale=Math.min(1,(now-n.born)/500);
    n.x+=n.vx; n.y+=n.vy;
    n.vx+=(Math.random()-0.5)*0.006; n.vy+=(Math.random()-0.5)*0.006;
    n.vx=Math.max(-0.35,Math.min(0.35,n.vx)); n.vy=Math.max(-0.35,Math.min(0.35,n.vy));
    const fs=Math.round(n.size*(0.65+0.35*n.scale));
    ctx.font="700 "+fs+"px Inter, system-ui, sans-serif";
    const halfW=ctx.measureText(n.label).width/2+6, halfH=fs/2+6;
    n.hw=halfW; n.hh=halfH;
    if(n.x<halfW){n.x=halfW;n.vx=Math.abs(n.vx);} if(n.x>w-halfW){n.x=w-halfW;n.vx=-Math.abs(n.vx);}
    if(n.y<halfH){n.y=halfH;n.vy=Math.abs(n.vy);} if(n.y>h-halfH){n.y=h-halfH;n.vy=-Math.abs(n.vy);}
    ctx.globalAlpha=n.scale; ctx.fillStyle=n.color;
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(n.label,n.x,n.y); ctx.globalAlpha=1;
  });
  NET.raf=requestAnimationFrame(loopNet);
}
window.addEventListener("resize",()=>{ if(NET) sizeNet(); });

async function renderWall(){
  app.innerHTML="";
  app.appendChild(el(head("Ideenwand","Wirf deine wildeste KI Idee rein")));
  if(!isMod){
    const box=el(`<div class="stack"><input type="text" id="i" maxlength="140" placeholder="Deine Idee ..."><button class="btn" id="is">Auf die Wand</button></div>`);
    app.appendChild(box);
    box.querySelector("#is").onclick=async()=>{
      const v=box.querySelector("#i").value.trim(); if(!v) return;
      box.querySelector("#i").value="";
      try{ await sb.from("bcn_ideas").insert({client_id:CID,text:v}); }catch(e){}
    };
  }
  const list=await ideaList();
  const wall=el(`<div class="ideas"></div>`);
  if(!list.length) wall.appendChild(el(`<span class="muted">Noch keine Ideen. Mach den Anfang.</span>`));
  list.forEach(i=>wall.appendChild(el(`<span class="idea">${escapeHtml(i.text)}</span>`)));
  app.appendChild(wall);
  app.appendChild(el(`<div class="count">${list.length} Ideen</div>`));
}

async function renderVote(){
  app.innerHTML="";
  app.appendChild(el(head("Audience Vote","Who’s the winner?")));
  const rows=await voteCounts();
  const total=rows.length;
  const counts={}; GROUPS.forEach(g=>counts[g]=0);
  rows.forEach(r=>{ if(counts[r.choice]!==undefined) counts[r.choice]++; });
  const max=Math.max(0,...GROUPS.map(g=>counts[g]));
  const leaders=GROUPS.filter(g=>counts[g]===max && max>0);

  if(isMod){
    const banner = total===0 ? "Noch keine Stimmen"
      : (leaders.length===1 ? "Führt: "+leaders[0] : "Kopf an Kopf: "+leaders.join(" · "));
    app.appendChild(el(`<div class="leader">${banner}</div>`));
    const box=el(`<div class="stack"></div>`);
    GROUPS.slice().sort((a,b)=>counts[b]-counts[a]).forEach(g=>{
      const pct=total?Math.round((counts[g]/total)*100):0;
      const lead=counts[g]===max && max>0;
      box.appendChild(el(`<div class="opt bar big-bar${lead?" lead":""}"><span class="fill${lead?" leadfill":""}" style="width:${pct}%"></span><span class="lab"><span>${g}</span><span class="pct">${counts[g]} · ${pct}%</span></span></div>`));
      const who=rows.filter(r=>r.choice===g).map(r=>r.voter_name||"ohne Namen");
      if(showNames() && who.length) box.appendChild(el(`<div class="voters">${who.map(n=>`<span class="voter">${escapeHtml(n)}</span>`).join("")}</div>`));
    });
    app.appendChild(box);
    app.appendChild(el(`<div class="count">${total} Stimmen</div>`));
  }else{
    const nm=getName();
    if(!nm){
      const nb=el(`<div class="stack"><p class="lead" style="margin:0">Erst dein Name, dann deine Stimme.</p><input type="text" id="vn" maxlength="40" placeholder="Vor und Nachname ..."><button class="btn" id="vns">Weiter zum Voting</button></div>`);
      app.appendChild(nb);
      nb.querySelector("#vns").onclick=async()=>{
        const v=nb.querySelector("#vn").value.trim(); if(v.length<2) return;
        setName(v);
        if(mine.vote){ try{ await sb.from("bcn_votes").update({voter_name:v}).eq("client_id",CID); }catch(e){} }
        refresh(true);
      };
      return;
    }
    const nmrow=el(mine.vote
      ? `<div class="count" style="margin:0 0 10px">Abgestimmt als <b>${escapeHtml(nm)}</b></div>`
      : `<div class="count" style="margin:0 0 10px">Du stimmst ab als <b>${escapeHtml(nm)}</b> · <a href="#" id="nmc" style="color:var(--taupe)">Name ändern</a><br>Du hast genau eine Stimme. Sie lässt sich danach nicht mehr ändern.</div>`);
    const nmc=nmrow.querySelector("#nmc");
    if(nmc) nmc.onclick=e=>{ e.preventDefault(); setName(""); try{ localStorage.removeItem("bcn_name"); }catch(x){} refresh(true); };
    app.appendChild(nmrow);
    const box=el(`<div class="stack"></div>`);
    GROUPS.forEach(g=>{
      const pct=total?Math.round((counts[g]/total)*100):0;
      const voted=mine.vote===g;
      const b=el(`<button class="opt${voted?" sel":""}"${mine.vote?" disabled":""}><span>${g}</span>${mine.vote?`<span class="pct">${pct}%</span>`:""}</button>`);
      if(mine.vote){ b.style.cursor="default"; if(!voted) b.style.opacity=".55"; }
      b.onclick=async()=>{
        if(mine.vote || VOTING) return;
        if(!confirm(`Deine Stimme für ${g}? Sie lässt sich danach nicht mehr ändern.`)) return;
        VOTING=true;
        let res; try{ res=await sb.from("bcn_votes").insert({client_id:CID,choice:g,voter_name:getName()}); }catch(e){ res={error:e}; }
        VOTING=false;
        const err=res && res.error;
        if(!err){ mine.vote=g; return refresh(true); }
        const msg=(err.message||"")+" "+(err.details||"");
        if(err.code==="23505" && msg.includes("bcn_votes_name_once")) alert("Mit diesem Namen wurde schon abgestimmt. Jede Person hat nur eine Stimme.");
        else if(err.code==="23505"){ await loadMine(); alert("Von diesem Handy wurde schon abgestimmt."); }
        else alert("Die Stimme kam nicht an. Bitte noch einmal versuchen.");
        refresh(true);
      };
      box.appendChild(b);
    });
    app.appendChild(box);
    app.appendChild(el(`<div class="count">${total} Stimmen${mine.vote?" · deine Stimme ist abgegeben":""}</div>`));
  }
}

async function renderQuiz(){
  const qi=STATE.quiz_index; const Q=QUIZ[qi];
  app.innerHTML="";
  if(!Q){ app.appendChild(el(`<div class="center"><div class="eyebrow">Quiz</div><h2>Gleich geht es los</h2></div>`)); return; }
  app.appendChild(el(head(`Quiz · Frage ${qi+1} von ${QUIZ.length}`, Q.q)));
  const answered=mine.quiz[qi]!==undefined;
  const reveal=STATE.quiz_reveal;
  const rows=reveal||isMod?await quizCounts(qi):[];
  const total=rows.length||1;
  const box=el(`<div class="stack"></div>`);
  Q.opts.forEach((o,idx)=>{
    const isRight=idx===Q.a;
    const cnt=rows.filter(r=>r.choice===idx).length;
    const pct=Math.round((cnt/total)*100);
    if(!answered && !isMod && !reveal){
      const b=el(`<button class="opt"><span>${o}</span></button>`);
      b.onclick=async()=>{ mine.quiz[qi]=idx; try{ await sb.from("bcn_quiz_answers").upsert({client_id:CID,q_index:qi,choice:idx,is_correct:isRight},{onConflict:"client_id,q_index"}); }catch(e){} refresh(true); };
      box.appendChild(b);
    }else{
      let cls="opt"; let mark="";
      if(reveal||isMod){
        if(isRight){cls+=" sel"; mark=`<span class="pct">richtig · ${pct}%</span>`;}
        else mark=`<span class="pct">${pct}%</span>`;
      }
      if(mine.quiz[qi]===idx && !isRight && reveal) mark=`<span class="pct">deine Wahl</span>`;
      box.appendChild(el(`<div class="${cls} ${reveal||isMod?"bar":""}">${reveal||isMod?`<span class="fill" style="width:${pct}%"></span>`:""}<span class="lab"><span>${o}</span>${mark}</span></div>`));
    }
  });
  app.appendChild(box);
  if(answered && !reveal && !isMod) app.appendChild(el(`<div class="count">Antwort gespeichert. Warte auf die Auflösung.</div>`));
  if(reveal||isMod) app.appendChild(el(`<div class="count">${rows.length} Antworten</div>`));
}

function renderThanks(){
  app.innerHTML="";
  app.appendChild(el(`<div class="center"><div class="accent" style="margin:0 auto 14px"></div><div class="eyebrow">YTTP Barcelona 2026</div><div class="big">Danke.</div><p class="lead muted">Your Transformation to Power.</p></div>`));
}

function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function busyTyping(){ const a=document.activeElement; return !!(a && a.tagName==="INPUT" && a.type==="text"); }

// Nur neu rendern, wenn sich Buehne oder sichtbare Daten geaendert haben (verhindert Flackern)
let _sig="";
function stateSig(){ return [STATE.stage,STATE.poll_index,STATE.quiz_index,STATE.quiz_reveal].join("|"); }
async function stageDataCount(){
  try{
    if(STATE.stage==="poll"){ const p=POLLS[STATE.poll_index]; if(!p) return "p-"; const r=await sb.from("bcn_poll_responses").select("id",{count:"exact",head:true}).eq("question",p.q); return "p"+STATE.poll_index+":"+(r.count||0); }
    if(STATE.stage==="wall"){ const r=await sb.from("bcn_ideas").select("id",{count:"exact",head:true}); return "w:"+(r.count||0); }
    if(STATE.stage==="vote"){ const {data}=await sb.from("bcn_votes").select("client_id,choice,voter_name"); return "v:"+(data||[]).map(r=>r.client_id+"="+r.choice+"/"+(r.voter_name||"")).sort().join(",")+"|"+showNames()+"|"+getName(); }
    if(STATE.stage==="quiz"){ const r=await sb.from("bcn_quiz_answers").select("id",{count:"exact",head:true}).eq("q_index",STATE.quiz_index); return "q"+STATE.quiz_index+":"+(r.count||0); }
  }catch(e){}
  return STATE.stage;
}
async function refresh(force){
  if(!force && busyTyping()) return;
  const cnt=await stageDataCount();
  const sig=stateSig()+"#"+cnt+"#"+(isMod?"m":"p");
  if(force || sig!==_sig){ _sig=sig; if(isMod) renderModbar(); render(); }
}

// ---- moderator ----
function renderModbar(){
  const bar=document.getElementById("modbar"); bar.classList.remove("hidden");
  const S=STATE;
  const stageBtn=(k,l)=>`<button data-stage="${k}" class="${S.stage===k?"on":""}">${l}</button>`;
  bar.innerHTML=`
    <div class="lbl">Bühne</div>
    <div class="row">
      ${stageBtn("welcome","Start / QR")}${stageBtn("poll","Umfrage")}${stageBtn("vote","Voting")}${stageBtn("thanks","Danke")}
    </div>
    <div class="lbl">Steuerung</div>
    <div class="row">
      <button data-act="poll-prev">Umfrage ‹</button>
      <button data-act="poll-next">Umfrage ›</button>
      <span class="tag">Umfrage ${S.poll_index+1}/${POLLS.length}</span>
      <button data-act="names">${showNames()?"Namen beim Voting verbergen":"Namen beim Voting zeigen"}</button>
    </div>
    <div class="modflow">Ablauf: <b>Start / QR</b> und <b>Umfrage</b> zu Beginn · <b>Voting</b> beim Pitch · <b>Danke</b> am Ende. Ideenphase läuft analog mit Post its.</div>`;
  bar.querySelectorAll("[data-stage]").forEach(b=>b.onclick=()=>patch({stage:b.dataset.stage}));
  bar.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>modAct(b.dataset.act));
}
async function modAct(a){
  const S=STATE;
  if(a==="names"){ try{ localStorage.setItem("bcn_shownames",showNames()?"0":"1"); }catch(e){} return refresh(true); }
  if(a==="poll-next") return patch({poll_index:Math.min(S.poll_index+1,POLLS.length-1),stage:"poll"});
  if(a==="poll-prev") return patch({poll_index:Math.max(S.poll_index-1,0),stage:"poll"});
  if(a==="quiz-next") return patch({quiz_index:Math.min(S.quiz_index+1,QUIZ.length-1),quiz_reveal:false,stage:"quiz"});
  if(a==="quiz-prev") return patch({quiz_index:Math.max(S.quiz_index-1,0),quiz_reveal:false,stage:"quiz"});
  if(a==="reveal") return patch({quiz_reveal:!S.quiz_reveal});
  if(a==="reset-quiz"){ if(confirm("Alle Quiz Antworten löschen?")){ try{await sb.from("bcn_quiz_answers").delete().neq("client_id","");}catch(e){} patch({quiz_index:-1,quiz_reveal:false}); } }
}
async function patch(obj){
  Object.assign(STATE,obj);
  try{ await sb.from("bcn_state").update({...obj,updated_at:new Date().toISOString()}).eq("id","main"); }catch(e){}
  await refresh(true);
}

// ---- realtime + boot ----
async function fetchState(){
  const {data}=await sb.from("bcn_state").select("*").eq("id","main").maybeSingle();
  if(data) STATE=data;
}
function subscribe(){
  sb.channel("bcn")
    .on("postgres_changes",{event:"*",schema:"public",table:"bcn_state"},payload=>{
      if(payload.new){ STATE=payload.new; refresh(); }
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"bcn_poll_responses"},()=>{ if(isMod && NET){ netFetch(); } else if(STATE.stage==="poll") refresh(); })
    .on("postgres_changes",{event:"*",schema:"public",table:"bcn_ideas"},()=>{ if(STATE.stage==="wall") refresh(); })
    .on("postgres_changes",{event:"*",schema:"public",table:"bcn_votes"},()=>{ if(STATE.stage==="vote") refresh(); })
    .on("postgres_changes",{event:"*",schema:"public",table:"bcn_quiz_answers"},()=>{ if(STATE.stage==="quiz") refresh(); })
    .subscribe();
  // Fallback alle 4s, falls Realtime klemmt. Rendert nur bei echter Aenderung
  // (Buehne oder Datenzahl), daher kein Flackern und kein Leeren beim Tippen.
  setInterval(async()=>{
    const before=stateSig();
    await fetchState();
    if(stateSig()!==before) refresh(true); else refresh();
  },4000);
}
(async function boot(){
  await loadMine();
  await fetchState();
  await refresh(true);
  subscribe();
})();
</script>
